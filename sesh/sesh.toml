# blacklist: regex patterns matched against session names, unanchored — ^code$ is
# the bare ~/Documents/code dir, the rest the jj-agent workspace suffixes. Same
# alternation herdr-select, kitty-select and tmux-sessionizer use; a bare "-ai"
# hides real projects too, like vertex-ai-demo.
blacklist = ["^code$", "-(ai[0-9]*|orch.*|exp|explore)$"]

[[session]]
name = "Vault"
path = "~/Documents/Vault"
startup_command = "nvim"

[[session]]
name = "dotfiles"
path = "~/.dotfiles"
startup_command = "jj pull"

# code/* subdirs: pull, single window
[[wildcard]]
pattern = "~/Documents/code/*"
startup_command = "jj pull || git pull origin main || true"
