# Personal speech-dispatcher config. Everything comes from the packaged file;
# the only change is DisableAutoSpawn.
#
# Why: the dummy output module keeps a PipeWire playback stream open for as
# long as the daemon runs, which leaves the desktop's privacy indicator
# reporting audio output in use indefinitely. TTS is off until needed: this
# stops libspeechd clients spawning the daemon directly, and the masks in
# systemd/user stop the globally enabled socket unit from activating it.
# To use TTS, start the daemon by hand; it exits after 30s idle:
#   speech-dispatcher -s -t 30
Include "/etc/speech-dispatcher/speechd.conf"

DisableAutoSpawn
