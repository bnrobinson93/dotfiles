# Personal speech-dispatcher config. Everything comes from the packaged file;
# the only change is DisableAutoSpawn.
#
# Why: the dummy output module keeps a PipeWire playback stream open for as
# long as the daemon runs, so any client that autospawns speech-dispatcher
# leaves the desktop's privacy indicator reporting audio output in use
# indefinitely. TTS still works when the daemon is started explicitly.
Include "/etc/speech-dispatcher/speechd.conf"

DisableAutoSpawn
