
[settings]
idiomatic_version_file_enable_tools = ["node", "go", "ruby", "terraform"]

[settings.ruby]
compile = false

[tools]
bun = "latest"
buf = "latest"
fzf = "0.70"
go = "latest"
node = "latest"
rust = "latest"
ruby = "latest"
terraform = "latest"
usage = "latest"
"github:agavra/tuicr" = "latest"
sqlc = "latest"
codex = "latest"
claude = "latest"
gh = "latest"
"aqua:modem-dev/hunk" = "latest"

# Dotfiles tasks — runnable from anywhere: `mise run stow`, `mise run skills`, ...
# install.sh should shrink into these over time.

[tasks.stow]
description = "Deploy non-AI dotfiles symlinks (config, local bin, home, ssh)"
dir = "~/.dotfiles"
run = [
  "stow -v2 .",
  "stow -v2 starship",
  "stow -v2 -t ~/.local -S dot-local --dotfiles",
  "stow -v2 -t ~ -S zsh --dotfiles",
  "stow -v2 -t ~/.ssh -S dot-ssh --dotfiles",
]

[tasks.skills]
description = "Deploy AI config and install/update skills and plugins"
dir = "~/.dotfiles"
run = "./update-skills.sh"

[tasks.update]
description = "Update everything (system, brew, mise, plugins) via topgrade"
run = "topgrade"
